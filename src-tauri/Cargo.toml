[package]
name = "focuscanvas"
version = "0.1.0"
description = "Local-first focus workspace with Excalidraw, tasks, and timer"
authors = ["Nabil"]
edition = "2021"

[lib]
name = "focuscanvas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = "2.6.3"

[dependencies]
tauri = "2.11.5"
tauri-plugin-sql = { version = "2.4.0", features = ["sqlite"] }
