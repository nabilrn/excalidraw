name: Windows Release

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install

      - name: Validate Google OAuth release credentials
        shell: pwsh
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:VITE_GOOGLE_CLIENT_ID)) {
            throw "VITE_GOOGLE_CLIENT_ID repository secret is missing."
          }
          if ([string]::IsNullOrWhiteSpace($env:GOOGLE_CLIENT_SECRET)) {
            throw "GOOGLE_CLIENT_SECRET repository secret is missing."
          }
          Write-Host "Google OAuth release credentials are configured."

      - name: Build Windows installers
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: npm run desktop:build

      - name: Upload Windows installers
        uses: actions/upload-artifact@v7
        with:
          name: FocusCanvas-Windows-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[release]')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $assets = @(
            Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | ForEach-Object { $_.FullName }
            Get-ChildItem "src-tauri/target/release/bundle/msi/*.msi" | ForEach-Object { $_.FullName }
          )

          if ($assets.Count -eq 0) {
            throw "No Windows installer assets were produced."
          }

          if ("${{ github.ref }}" -like "refs/tags/v*") {
            $tag = "${{ github.ref_name }}"
          } else {
            $config = Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
            $tag = "v$($config.version)"
          }

          $notesFile = ".github/release-notes/$tag.md"

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $assets --clobber
            if (Test-Path $notesFile) {
              gh release edit $tag `
                --title "FocusCanvas $tag" `
                --notes-file $notesFile `
                --latest
            }
          } else {
            if (Test-Path $notesFile) {
              gh release create $tag $assets `
                --target "${{ github.sha }}" `
                --title "FocusCanvas $tag" `
                --notes-file $notesFile `
                --latest
            } else {
              gh release create $tag $assets `
                --target "${{ github.sha }}" `
                --title "FocusCanvas $tag" `
                --generate-notes `
                --latest
            }
          }
