name: FocusCanvas Website

on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - "docs/screenshots/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble static site
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site/assets
          cp site/index.html site/styles.css site/app.js _site/
          cp docs/screenshots/focuscanvas-tasks-current.webp _site/assets/tasks-calendar.webp
          cp docs/screenshots/focuscanvas-canvases-current.webp _site/assets/canvases-groups.webp
          sed -i 's/tasks-calendar\.png/tasks-calendar.webp/g; s/canvases-groups\.png/canvases-groups.webp/g' _site/index.html
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
